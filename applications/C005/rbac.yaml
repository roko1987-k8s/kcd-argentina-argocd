apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "c005-dev"
  namespace: "c005"
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "c005-dev"
  namespace: "c005"
subjects:
  - kind: Group
    name: "c005-groups-dev"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: "c005-dev"
  apiGroup: rbac.authorization.k8s.io
