apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ux-kcd-argentina
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/roko1987-k8s/kcd-argentina-apps.git
    targetRevision: main
    path: C005/ux-kcd-argentina
  destination:
    server: https://kubernetes.default.svc
    namespace: c005
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
